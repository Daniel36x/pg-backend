spring.application.name=productAdmin

server.port = 8083


spring.datasource.url=jdbc:h2:mem:supermercado_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.h2.console.enabled=true

##http://localhost:8080/h2-console

# --- Seguridad JWT ---
# En producción, mueve el secreto a una variable de entorno (JWT_SECRET) en vez de dejarlo en el repo.
jwt.secret=${JWT_SECRET:mOz/se+++HT6WuvDeSXD+paDRNHj+VMnAfQAqKR6O7Y=}
jwt.expiration-ms=86400000

# Usuario ADMIN creado automáticamente al arrancar (el registro público solo crea rol EMPLEADO)
app.security.default-admin.username=${DEFAULT_ADMIN_USER:admin}
app.security.default-admin.password=${DEFAULT_ADMIN_PASSWORD:Admin123!}

# --- CORS ---
# Orígenes permitidos, separados por coma. En producción, sobreescribe con el/los dominio(s) reales del frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- MQTT ---
# URL del broker (Mosquitto). ÚNICO lugar donde se define la IP: la usan MqttPub y también
# MqttSubAlimentos/MqttSubDomestico (vía MqttBrokerConfig). Para cambiar de red sin tocar
# este archivo, exporta la variable de entorno MQTT_BROKER_URL (tiene prioridad sobre esta línea).
mqtt.broker.url=tcp://192.168.110.229